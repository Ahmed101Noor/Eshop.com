<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop - My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="alertPlaceholder" class="position-fixed top-0 end-0 p-3" style="z-index: 11"></div>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">E-Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="orders.html">My Orders</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <button class="btn btn-outline-primary me-2" data-bs-toggle="offcanvas" data-bs-target="#wishlistOffcanvas">
                        <i class="bi bi-heart"></i> Wishlist
                        <span class="badge bg-primary wishlist-count">0</span>
                    </button>
                    <button class="btn btn-outline-primary me-2" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                        <i class="bi bi-cart"></i> Cart
                        <span class="badge bg-primary cart-count">0</span>
                    </button>
                    <button class="btn btn-danger" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Orders</h2>
            <div class="d-flex gap-2">
                <select class="form-select" id="statusFilter" onchange="loadCustomerOrders()">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <select class="form-select" id="sortOrder" onchange="loadCustomerOrders()">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="accordion" id="ordersAccordion"></div>
            </div>
        </div>
    </div>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end" id="cartOffcanvas" tabindex="-1">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Shopping Cart</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div id="cartItems"></div>
            <div class="mt-3">
                <h5>Total: $<span id="cartTotal">0.00</span></h5>
                <button class="btn btn-primary w-100" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <!-- Wishlist Offcanvas -->
    <div class="offcanvas offcanvas-end" id="wishlistOffcanvas" tabindex="-1">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Wishlist</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div id="wishlistItems"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/customer.js"></script>
    <script>
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadCustomerOrders();
            updateCartCount();
            updateWishlistCount();
        });
    </script>
</body>
</html>
